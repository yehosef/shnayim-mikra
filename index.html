<!doctype html>
<html lang="en" dir="ltr" translate="no">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google" content="notranslate" />
    <!-- Browser / installed-app bar colour: the page background of each
         theme (src/style.css --c-bg), so the app opens without a flash. -->
    <meta name="theme-color" content="#f5f5f5" />
    <title>שניים מקרא ואחד תרגום</title>
    <script>
      // Interface direction before the app mounts (no flash): App.vue keeps it
      // in step with settings.interfaceLanguage afterwards. With no saved
      // language, a Hebrew browser gets Hebrew: the same rule as
      // browserLanguage() in src/lib/settingsDefaults.js.
      (function () {
        var he = false
        try {
          var l = String((navigator && navigator.language) || '').toLowerCase()
          he = l.indexOf('he') === 0 || l.indexOf('iw') === 0
        } catch (e) { /* default: English */ }
        try {
          var s = JSON.parse(localStorage.getItem('shnayim-settings') || 'null')
          if (s && typeof s === 'object' && typeof s.interfaceLanguage === 'string') {
            he = s.interfaceLanguage === 'he'
          }
        } catch (e) { /* keep the browser default */ }
        document.documentElement.lang = he ? 'he' : 'en'
        document.documentElement.dir = he ? 'rtl' : 'ltr'
        // Theme before first paint: Settings' light / dark / auto, auto following
        // the system. Same rule as resolveTheme() in src/composables/useTheme.js;
        // the colours are the --c-bg values of src/style.css.
        var theme = 'auto'
        try {
          var st = JSON.parse(localStorage.getItem('shnayim-settings') || 'null')
          if (st && (st.theme === 'light' || st.theme === 'dark')) theme = st.theme
        } catch (e) { /* auto */ }
        if (theme === 'auto') {
          var dark = false
          try { dark = !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) } catch (e) { /* light */ }
          theme = dark ? 'dark' : 'light'
        }
        document.documentElement.setAttribute('data-theme', theme)
        var meta = document.querySelector('meta[name="theme-color"]')
        if (meta) meta.setAttribute('content', theme === 'dark' ? '#111827' : '#f5f5f5')
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
