<!doctype html>
<html lang="en" dir="ltr" translate="no">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google" content="notranslate" />
    <!-- Browser / installed-app bar colour: the page background of each
         theme (src/style.css --c-bg), so the app opens without a flash. -->
    <meta name="theme-color" content="#f5f5f5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111827" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <title>שניים מקרא ואחד תרגום</title>
    <script>
      // Interface direction before the app mounts (no flash): App.vue keeps it
      // in step with settings.interfaceLanguage afterwards. With no saved
      // language, a Hebrew browser gets Hebrew: the same rule as
      // browserLanguage() in src/lib/settingsDefaults.js.
      (function () {
        var he = false
        try {
          var l = String((navigator && navigator.language) || '').toLowerCase()
          he = l.indexOf('he') === 0 || l.indexOf('iw') === 0
        } catch (e) { /* default: English */ }
        try {
          var s = JSON.parse(localStorage.getItem('shnayim-settings') || 'null')
          if (s && typeof s === 'object' && typeof s.interfaceLanguage === 'string') {
            he = s.interfaceLanguage === 'he'
          }
        } catch (e) { /* keep the browser default */ }
        document.documentElement.lang = he ? 'he' : 'en'
        document.documentElement.dir = he ? 'rtl' : 'ltr'
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
